name: Build & Deploy Portal v2 to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: portal
        run: npm install

      # ── 4. Build Next.js app (on GitHub's 7 GB runner, not the 1 GB EC2) ─────
      - name: Build Next.js app
        working-directory: portal
        run: npm run build
        env:
          NODE_ENV: production

      # ── 5. Rsync compiled .next output to EC2 ────────────────────────────────
      #    Push only the compiled artefacts — EC2 never runs `npm run build`
      - name: Rsync .next to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: portal/.next/
          remote_path: ~/portal-v2/portal/.next/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      # ── 6. Pull source + install prod deps + restart pm2 on EC2 ─────────────
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/portal-v2
            PORTAL_DIR=$APP_DIR/portal

            # Ensure the repo directory exists
            mkdir -p $APP_DIR

            echo "==> Preserving runtime data (story-persistence, ideas, feedback)"
            mkdir -p /tmp/portal-v2-data-backup
            [ -f $PORTAL_DIR/data/story-persistence.json ] && cp $PORTAL_DIR/data/story-persistence.json /tmp/portal-v2-data-backup/ || true
            [ -f $PORTAL_DIR/data/ideas.json ]             && cp $PORTAL_DIR/data/ideas.json             /tmp/portal-v2-data-backup/ || true
            [ -f $PORTAL_DIR/data/feedback.json ]          && cp $PORTAL_DIR/data/feedback.json          /tmp/portal-v2-data-backup/ || true

            echo "==> Pulling latest source code"
            cd $APP_DIR
            if [ ! -d .git ]; then
              cd ~
              rm -rf portal-v2
              git clone --branch main https://github.vodafone.com/VFGroup-VOISReusable-Assets/ai-delivery-capabilities.git portal-v2
              cd portal-v2
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "==> Restoring runtime data"
            mkdir -p $PORTAL_DIR/data
            [ -f /tmp/portal-v2-data-backup/story-persistence.json ] && cp /tmp/portal-v2-data-backup/story-persistence.json $PORTAL_DIR/data/ || true
            [ -f /tmp/portal-v2-data-backup/ideas.json ]             && cp /tmp/portal-v2-data-backup/ideas.json             $PORTAL_DIR/data/ || true
            [ -f /tmp/portal-v2-data-backup/feedback.json ]          && cp /tmp/portal-v2-data-backup/feedback.json          $PORTAL_DIR/data/ || true

            echo "==> Installing production dependencies"
            cd $PORTAL_DIR
            npm install --omit=dev

            echo "==> Restarting pm2 on port 3001 (build already synced by rsync)"
            export PORT=3001
            pm2 restart portal-v2 || pm2 start npm --name portal-v2 -- start
            pm2 save

            echo "==> Deploy complete ✅ (serving at /v2 via port 3001)"
