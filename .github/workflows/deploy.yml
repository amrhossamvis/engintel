name: Build & Deploy Portal v2 to EC2

on:
  push:
    branches:
      - v2-deploy
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js + pnpm ─────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: portal/pnpm-lock.yaml

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: portal
        run: pnpm install --frozen-lockfile --no-workspace

      # ── 4. Build Next.js app (standalone output) ─────────────────────────────
      - name: Build Next.js app
        working-directory: portal
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'

      # ── 5. Rsync standalone build + static + public to EC2 ───────────────────
      #    The standalone output is self-contained — just needs `node server.js`
      - name: Rsync standalone build to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: portal/.next/standalone/
          remote_path: ~/portal-v2/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Rsync static assets to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: portal/.next/static/
          remote_path: ~/portal-v2/.next/static/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      - name: Rsync public folder to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: portal/public/
          remote_path: ~/portal-v2/public/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      # ── 6. Restart the app on EC2 ───────────────────────────────────────────
      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/portal-v2

            echo "==> Restarting portal-v2 on port 3001"
            cd $APP_DIR

            # The standalone output runs with `node server.js`
            export PORT=3001
            export HOSTNAME=0.0.0.0
            export NODE_ENV=production

            pm2 restart portal-v2 || pm2 start server.js --name portal-v2 --cwd $APP_DIR -- --port 3001
            pm2 save

            echo "==> Deploy complete ✅ (serving at /v2 via port 3001)"
