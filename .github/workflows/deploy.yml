name: Build & Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build on GitHub & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: portal
        run: npm install

      # ── 4. Build Next.js app (on GitHub's 7 GB runner, not the 1 GB EC2) ─────
      - name: Build Next.js app
        working-directory: portal
        run: npm run build
        env:
          NODE_ENV: production

      # ── 5. Rsync compiled .next output to EC2 ────────────────────────────────
      #    Push only the compiled artefacts — EC2 never runs `npm run build`
      - name: Rsync .next to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: portal/.next/
          remote_path: ~/engintel/portal/.next/
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}
          remote_key: ${{ secrets.EC2_SSH_KEY }}

      # ── 6. Pull source + install prod deps + restart pm2 on EC2 ─────────────
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/engintel

            echo "==> Preserving runtime data (story-persistence, ideas, feedback)"
            mkdir -p /tmp/engintel-data-backup
            [ -f portal/data/story-persistence.json ] && cp portal/data/story-persistence.json /tmp/engintel-data-backup/ || true
            [ -f portal/data/ideas.json ]             && cp portal/data/ideas.json             /tmp/engintel-data-backup/ || true
            [ -f portal/data/feedback.json ]          && cp portal/data/feedback.json          /tmp/engintel-data-backup/ || true

            echo "==> Pulling latest source code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Restoring runtime data"
            mkdir -p portal/data
            [ -f /tmp/engintel-data-backup/story-persistence.json ] && cp /tmp/engintel-data-backup/story-persistence.json portal/data/ || true
            [ -f /tmp/engintel-data-backup/ideas.json ]             && cp /tmp/engintel-data-backup/ideas.json             portal/data/ || true
            [ -f /tmp/engintel-data-backup/feedback.json ]          && cp /tmp/engintel-data-backup/feedback.json          portal/data/ || true

            echo "==> Installing production dependencies"
            cd portal
            npm install --omit=dev

            echo "==> Restarting pm2 (build already synced by rsync)"
            pm2 restart portal || pm2 start npm --name portal -- start
            pm2 save

            echo "==> Deploy complete ✅"
